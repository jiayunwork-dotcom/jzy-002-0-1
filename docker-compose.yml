# 一键启动: docker compose up --build -d
# 服务: http://localhost:8080
services:
  heatx:
    build:
      context: .
      dockerfile: Dockerfile
    image: heatx-server:latest
    container_name: heatx
    ports:
      - "8080:8080"
    environment:
      # 服务监听端口(容器内)
      HEATX_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
